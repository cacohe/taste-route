name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install -r requirements.txt --system

      - name: Python syntax check
        run: python -m compileall app

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Check dependency consistency
        run: python -m pip check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Typecheck and build
        run: pnpm build

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --tag taste-route:ci .

  deploy-render:
    name: Deploy Render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/render_deploy.py --require-hook

      - name: Smoke-test deployed commit
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/smoke_test.py --base-url "$RENDER_SERVICE_URL" --expected-commit "$GITHUB_SHA" --timeout-seconds 900
